include:
  - project: konradodwrot/centralized/assets/generic
    ref: $GRP_KO_VAR_CENTRALIZED_ASSETS_GENERIC_REF
    file:
      - consumer-repo-config/files-generation/templates/FilesTrackedVerify.gitlab-ci.yml
      - consumer-repo-config/precommit-lefthook/templates/PrecommitChanged.gitlab-ci.yml
      - consumer-repo-config/precommit-lefthook/templates/PrecommitAll.gitlab-ci.yml
  - project: konradodwrot/centralized/assets/generic
    ref: $GRP_KO_VAR_CENTRALIZED_ASSETS_GENERIC_REF
    file: consumer-repo-config/release/templates/TagMint.gitlab-ci.yml
    inputs:
      changes: [bin/**/*, lib/**/*, workspace/**/*, .che/**/*, Makefile]

#[why] an emitted event arrives as source `api`, not `pipeline`: emit-events.zsh posts to
#   /projects/:id/pipeline with a PRIVATE-TOKEN header, and only the /trigger/pipeline form (a
#   per-project trigger token) yields `pipeline`. Both are accepted so a rule keeps matching
#   whichever transport the emitter uses
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - validate
  - dispatch
  - regen
  - release

#[why] all CI runs on the self-hosted GKE runners: no SaaS compute minutes remain. set once here so a
#   new job inherits it instead of silently having no runner. gke-linux-amd64 resolves to the medium
#   size, matching the SaaS runner it replaces
default:
  #[why] spot nodes are preempted mid-job and the manager itself runs on spot: infrastructure
  #   failures are expected, not exceptional. 2 is gitlab's hard maximum, so 3 attempts in total.
  #   retries cover runner and API faults only, never a failing script
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - unknown_failure
  tags:
    - gke-linux-amd64

variables:
  ARTIFACT_REGISTRY: $GRP_KO_VAR_ARTIFACT_REGISTRY
  OCI_IMAGES_CI_LINUX_REF: $GRP_KO_VAR_OCI_IMAGES_CI_LINUX_REF
  CHE_SCHEMA_REF: $GRP_KO_VAR_CHE_SCHEMA_REF
  PROSE_SPEC_REF: $GRP_KO_VAR_PROSE_SPEC_REF
  CENTRALIZED_ASSETS_GENERIC_REF: $GRP_KO_VAR_CENTRALIZED_ASSETS_GENERIC_REF
  AI_TOOLS_CONFIGS_REF: $GRP_KO_VAR_AI_TOOLS_CONFIGS_REF
  CI_IMAGE: $ARTIFACT_REGISTRY/ci-linux:$OCI_IMAGES_CI_LINUX_REF

validate-deps-graph:
  tags:
    - gke-linux-amd64-small
  stage: validate
  image: $CI_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "api"
      when: never
    - when: on_success
      changes:
        - bin/**/*
        - lib/**/*
        - .gitlab-ci.yml
  #[why] the group's read-only token, not the maintainer one dispatch-event uses: this job only
  #   reads declarations, and the write token is protected, so on an MR branch it resolves empty.
  #   Unauthenticated every private repo 404s, which the reader takes as "declares nothing": the
  #   repo vanishes from the aggregate and the job reports drift against a graph that is correct
  #[why] the graph lives in its own repo and GraphWriter commits to it through the API, so nothing
  #   ever puts it on disk here. Without this clone the default --graph-dir (.graph) is an empty
  #   path, every generated file compares against nothing, and the job reports drift unconditionally
  variables:
    AUTOMATION_GITLAB_TOKEN: $GRP_KO_UNPROTECTED_VAR_BOT_GITLAB_TOKEN
    AUTOMATION_GRAPH_DIR: $CI_PROJECT_DIR/.graph
  script:
    - git clone --depth 1 "https://gitlab-ci-token:${AUTOMATION_GITLAB_TOKEN}@gitlab.com/konradodwrot/cross-repo/graph.git" "$AUTOMATION_GRAPH_DIR"
    - make aggregate-check

test-ruby:
  tags:
    - gke-linux-amd64-small
  stage: validate
  image: $CI_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "api"
      when: never
    - when: on_success
      changes:
        - bin/**/*
        - lib/**/*
        - test/**/*
        - Makefile
  script:
    - make test

dispatch-event:
  tags:
    - gke-linux-amd64-small
  stage: dispatch
  image: $CI_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "api"
  variables:
    AUTOMATION_GITLAB_TOKEN: $REPO_PROTECTED_VAR_BOT_AUTOMATION_GITLAB_TOKEN
  script:
    - make aggregate
    - make dispatch
  artifacts:
    paths:
      - regen-pipeline.yml

regen-fan-out:
  stage: regen
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "api"
  needs:
    - dispatch-event
  trigger:
    include:
      - artifact: regen-pipeline.yml
        job: dispatch-event
    strategy: depend
