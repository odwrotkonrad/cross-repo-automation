workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - validate
  - dispatch
  - regen
  - release

#[why] all CI runs on the self-hosted GKE runners: no SaaS compute minutes remain. set once here so a
#   new job inherits it instead of silently having no runner. gke-linux-amd64 resolves to the medium
#   size, matching the SaaS runner it replaces
default:
  #[why] spot nodes are preempted mid-job and the manager itself runs on spot: infrastructure
  #   failures are expected, not exceptional. 2 is gitlab's hard maximum, so 3 attempts in total.
  #   retries cover runner and API faults only, never a failing script
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - unknown_failure
  tags:
    - gke-linux-amd64

variables:
  ARTIFACT_REGISTRY: $GRP_KO_VAR_ARTIFACT_REGISTRY
  OCI_IMAGES_CI_LINUX_REF: $GRP_KO_VAR_OCI_IMAGES_CI_LINUX_REF
  CHE_SCHEMA_REF: $GRP_KO_VAR_CHE_SCHEMA_REF
  PROSE_SPEC_REF: $GRP_KO_VAR_PROSE_SPEC_REF
  PROSE_ASSETS_REF: $GRP_KO_VAR_PROSE_ASSETS_REF
  AI_CONFIGS_REF: $GRP_KO_VAR_AI_CONFIGS_REF
  MISC_REF: $GRP_KO_VAR_MISC_REF
  CI_IMAGE: $ARTIFACT_REGISTRY/ci-linux:$OCI_IMAGES_CI_LINUX_REF

validate-pre-commit-all:
  tags:
    - gke-linux-amd64-small
  stage: validate
  image: $CI_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - when: on_success
      changes:
        - .gitlab-ci.yml
        - .env.tpl
        - che.yml
        - Makefile
        - lefthook.yml
        - .repo/*.tpl
        - .repo/dependency-graph.yml
        - .repo/artifacts-consumed.yml
        - bin/**/*
        - lib/**/*
        - test/**/*
        - workspace/**/*
        - README.md
  script:
    - make repo-ci-precommit-all
    - git diff --exit-code HEAD

validate-deps-graph:
  tags:
    - gke-linux-amd64-small
  stage: validate
  image: $CI_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - when: on_success
      changes:
        - bin/**/*
        - lib/**/*
        - .gitlab-ci.yml
  script:
    - make aggregate-check

test-ruby:
  tags:
    - gke-linux-amd64-small
  stage: validate
  image: $CI_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - when: on_success
      changes:
        - bin/**/*
        - lib/**/*
        - test/**/*
        - Makefile
  script:
    - make test

dispatch-event:
  tags:
    - gke-linux-amd64-small
  stage: dispatch
  image: $CI_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"
  variables:
    AUTOMATION_GITLAB_TOKEN: $REPO_VAR_AUTOMATION_GITLAB_TOKEN
  script:
    - make aggregate
    - make dispatch
  artifacts:
    paths:
      - regen-pipeline.yml

regen-fan-out:
  stage: regen
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"
  needs:
    - dispatch-event
  trigger:
    include:
      - artifact: regen-pipeline.yml
        job: dispatch-event
    strategy: depend

#[why] a merge to the default branch is the release event: mint the next semver tag so consumers can
#   pin a version instead of tracking a moving branch. tag only, no release object: nothing here ships
#   an artifact
tag-mint:
  tags:
    - gke-linux-amd64-small
  stage: release
  image: $CI_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - bin/**/*
        - lib/**/*
        - workspace/**/*
        - che.yml
        - Makefile
  variables:
    GIT_DEPTH: "0"
    TAG_TOKEN: $REPO_VAR_TAG_TOKEN
  script:
    - make tag-mint

