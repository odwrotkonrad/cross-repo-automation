repositories:
  - repo: ai-sandbox
    artifacts:
      - {name: sandbox, type: oci-image}
  - repo: che-packages
    artifacts:
      - {name: catalog, type: dataset}
  - repo: configs
    artifacts:
      - {name: zsh/base-linux, type: che-profile}
      - {name: llm/claude, type: ai-prose}
  - repo: cross-repo/automation
    artifacts:
      - {name: deps-graph, type: dataset}
      - {name: workspace, type: che-profile}
  - repo: cross-repo/infra/iac
    artifacts:
      - {name: tf-lock, type: lockfile}
      - {name: ci-var/artifact-registry, type: ci-variable}
      - {name: ci-var/prose-assets-ref, type: ci-variable}
      - {name: ci-var/prose-spec-ref, type: ci-variable}
      - {name: ci-var/misc-ref, type: ci-variable}
      - {name: ci-var/ci-images-ref, type: ci-variable}
      - {name: ci-var/che-packages-ref, type: ci-variable}
      - {name: ci-var/che-backup-auto-create, type: ci-variable}
      - {name: ci-var/enable-darwin-ci, type: ci-variable}
      - {name: ci-var/configs-ref, type: ci-variable}
      - {name: ci-var/automation-ref, type: ci-variable}
      - {name: ci-var/iac-ref, type: ci-variable}
  - repo: cross-repo/infra/oci-images
    artifacts:
      - {name: ci-linux, type: oci-image}
      - {name: ci-linux-dind, type: oci-image}
      - {name: dev-sandbox, type: oci-image}
  - repo: cross-repo/misc
    artifacts:
      - {name: ci-scripts, type: script}
      - {name: ci-templates, type: ci-template}
      - {name: che-profile-matrix-check, type: script}
  - repo: cross-repo/prose/assets
    artifacts:
      - {name: repo-prose, type: ai-prose}
      - {name: shared-prose, type: ai-prose}
      - {name: doc-templates, type: ai-prose}
      - {name: license, type: ai-prose}
  - repo: cross-repo/prose/spec
    artifacts:
      - {name: conventions-doc, type: ai-prose}
      - {name: repo-spec, type: ai-prose}
  - repo: go-modules
    artifacts:
      - {name: che, type: binary}
      - {name: get-os-open-files-with, type: binary}
      - {name: get-term-open-files-with, type: binary}
      - {name: lib, type: go-module}
  - repo: notes
    artifacts: []
  - repo: resume-md-pdf
    artifacts:
      - {name: styled-resume-pdf, type: pdf}
